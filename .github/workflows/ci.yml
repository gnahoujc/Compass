name: CI

on:
  pull_request:

permissions:
  contents: read

# A new push to the same pull request cancels the run it replaces.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Also type-checks (tsc) and catches anything that would break the Pages deploy.
      - run: npm run build
